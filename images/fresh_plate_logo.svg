<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b8b" />
      <stop offset="100%" stop-color="#ec3c6a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ec3c6a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Crown / Luxury Emblem -->
  <g id="emblem" transform="translate(300, 58)" filter="url(#glow)">
    <!-- Top Cross / Finial -->
    <path d="M-2 -32 h4 v7 h-4 z M-6 -28 h12 v4 h-12 z" fill="url(#accentGrad)" />
    <circle cx="0" cy="-23" r="3.5" fill="url(#accentGrad)" />
    
    <!-- Crown Dome Arch -->
    <path d="M -48 -2 C -48 -24, 48 -24, 48 -2 C 38 6, -38 6, -48 -2 Z" 
          fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Inner Heart / Arch Detail -->
    <path d="M 0 -18 C -14 -30, -32 -10, -20 6 C -10 14, 0 18, 0 18 C 0 18, 10 14, 20 6 C 32 -10, 14 -30, 0 -18 Z" 
          fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="4,3" />
    
    <!-- Crown Base Band -->
    <rect x="-54" y="8" width="108" height="14" rx="4" fill="url(#accentGrad)" />
    <circle cx="-36" cy="15" r="3.5" fill="#211f17" />
    <circle cx="-18" cy="15" r="3.5" fill="#211f17" />
    <circle cx="0" cy="15" r="3.5" fill="#211f17" />
    <circle cx="18" cy="15" r="3.5" fill="#211f17" />
    <circle cx="36" cy="15" r="3.5" fill="#211f17" />
    
    <!-- Base Arch -->
    <path d="M -58 26 Q 0 32 58 26 Q 0 38 -58 26 Z" fill="url(#accentGrad)" />
  </g>

  <!-- Brand Typography -->
  <!-- Main Brand Title -->
  <text x="300" y="156" 
        text-anchor="middle" 
        font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" 
        font-size="42" 
        font-weight="800" 
        letter-spacing="9" 
        fill="#ffffff">FRESH PLATE</text>

  <!-- Elegant Subtitle & Divider -->
  <g transform="translate(300, 185)">
    <line x1="-180" y1="-6" x2="-95" y2="-6" stroke="#ec3c6a" stroke-width="1.5" opacity="0.7" />
    <polygon points="-90,-6 -86,-10 -82,-6 -86,-2" fill="#ec3c6a" />
    <text x="0" y="-1" 
          text-anchor="middle" 
          font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" 
          font-size="13.5" 
          font-weight="600" 
          letter-spacing="6.5" 
          fill="#e8a5b8">HOTEL &amp; RESORT</text>
    <polygon points="82,-6 86,-10 90,-6 86,-2" fill="#ec3c6a" />
    <line x1="95" y1="-6" x2="180" y2="-6" stroke="#ec3c6a" stroke-width="1.5" opacity="0.7" />
  </g>
</svg>

